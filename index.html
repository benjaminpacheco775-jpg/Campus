<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px}

h1{font-size:1.3rem;margin:0}h1 small{display:block;font-weight:400;color:var(--mu);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}

label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);width:100%;margin-top:16px;padding:10px;font-weight:600}
.err{color:#c62828;font-size:.9rem;min-height:1.3em;margin-top:8px}
.hint{margin-top:14px;font-size:.8rem;color:var(--mu);border-top:1px dashed var(--bd);padding-top:10px}
.subj{margin-bottom:14px}
.subj h2{margin:0 0 10px;font-size:1.1rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 12px;font-size:.88rem}
.tab.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.tab.lock{color:var(--lk);background:var(--lkb)}
ul{margin:0;padding:0;list-style:none}li{margin:0 0 12px;padding-left:12px;border-left:3px solid var(--pr)}li b{display:block}li span{display:block;color:var(--mu);font-size:.92rem}.help{font-size:.85rem;color:var(--mu);margin-top:8px}
.badge{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--okb);color:var(--ok);margin-bottom:8px}
.locked{background:var(--lkb);color:var(--lk);border-radius:10px;padding:14px;text-align:center;font-size:.92rem}
.hide{display:none}

.seg{display:flex;gap:6px;margin-bottom:6px}.seg button{flex:1}.seg button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}.row small{color:var(--mu);display:block}
.sw{position:relative;flex:none;width:48px;height:28px;border-radius:99px;background:var(--lk);border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.pill{font-size:.75rem;color:var(--mu);margin-left:6px;font-weight:400}
</style>
</head>

function loadLocal(){try{H=JSON.parse(localStorage.getItem("campus34_hab")||"{}")}catch(e){H={}}}

loadLocal();
(async()=>{try{const db=await claude.use("db");if(!db)return;dbc=db.collection("hab");

 user=u;$("err").textContent="";$("vLogin").classList.add("hide");$("vApp").classList.remove("hide");render()}

  const s=document.createElement("div");s.className="card subj";

  const tabs=s.querySelector(".tabs"),body=s.querySelector(".body");

  const cur=sel[user.anio+mat]??last;
  const show=t=>{sel[user.anio+mat]=t;[...tabs.children].forEach((b,i)=>b.classList.toggle("on",i===t));
   body.innerHTML=estaHab(user.anio,mat,t)?"<span class='badge'>Disponible</span><ul>"+tris[t].split("|").map(x=>{const[a,b]=x.split("~");return "<li><b>"+a+"</b><span>"+b+"</span></li>"}).join("")+"</ul><div class='help'>¿Algún tema no te sale? Buscalo por su nombre y consultale a tu profesor.</div>":"<div class='locked'>🔒 Este temario todavía no está habilitado por tu profesor.</div>"};
  tris.forEach((_,t)=>{const h=estaHab(user.anio,mat,t),b=document.createElement("button");b.className="tab"+(h?"":" lock");
   b.textContent=(h?"":"🔒 ")+(t+1)+".º trimestre";b.onclick=()=>show(t);tabs.appendChild(b)});
  box.appendChild(s);show(cur)})}
function mine(a,m){return user.mats.some(x=>{const[ya,ym]=x.split(":");return(ya==="*"||ya==a)&&ym===m})}
function renderP(){
 $("sub").textContent="Habilitá o deshabilitá los temarios de tus materias";
 const box=$("list");box.innerHTML="";
 for(let a=1;a<=6;a++)Object.keys(TEMARIO[a]).forEach(m=>{if(!mine(a,m))return;
  const tris=TEMARIO[a][m],s=document.createElement("div");s.className="card subj";
  const h2=document.createElement("h2");h2.textContent=m;const p=document.createElement("span");p.className="pill";p.textContent=a+".º año";h2.appendChild(p);s.appendChild(h2);
  tris.forEach((tp,t)=>{const on=estaHab(a,m,t),r=document.createElement("div");r.className="row";
   r.innerHTML="<div><b>"+(t+1)+".º trimestre</b><small></small></div>";r.querySelector("small").textContent=tp.split("|").map(x=>x.split("~")[0]).join(" · ");
   const b=document.createElement("button");b.className="sw"+(on?" on":"");b.setAttribute("role","switch");b.setAttribute("aria-checked",on);b.setAttribute("aria-label",m+" "+a+".º año, "+(t+1)+".º trimestre");
   b.onclick=()=>setHab(a,m,t,!on);r.appendChild(b);s.appendChild(r)});
  box.appendChild(s)})}
$("go").onclick=login;$("c").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("out").onclick=()=>{user=null;$("c").value="";$("vApp").classList.add("hide");$("vLogin").classList.remove("hide")};
</script>
